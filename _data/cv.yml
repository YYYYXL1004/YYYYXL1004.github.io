      - company: CAGRec — 协同锚定引导的多模态生成式推荐
        position: 第一作者
        start_date: 2025-10
        end_date: 2026-04
        summary: >-
          提出 CAGRec 框架，在编码、训练、推理三阶段系统性注入协同信号，弥合多模态生成式推荐中的内容-协同鸿沟与离散-连续鸿沟。
          主导算法设计、代码实现、全部实验与论文撰写。
        highlights:
          - "已投稿至 ACM MM 2026 (CCF-A)，第一作者"
          - "在 Amazon 3 个数据集上全部 15 项指标达到 SOTA"
          - "NDCG@10 较最强基线提升 2.0%–3.7%"

      - company: TAAC2025 腾讯广告算法大赛 — 全模态生成式推荐赛道
        position: 队长
        start_date: 2025-08
        end_date: 2025-09
        summary: >-
          在 Transformer Baseline 上独立完成模型重构与训练优化，包括 RoPE + TimeDelta-ATTN、InfoNCE 对比学习、
          BF16 混合精度训练、ANN 检索 + RRF 多路融合等。
        highlights:
          - "本科双人队伍，初赛排名前 10%（约 1400 支本硕博混合队伍）"
          - "NDCG@10: 0.0179 → 0.0746（相对 Baseline 提升 317%）"

      - company: DualBand-RingID — 面向 AIGC 图像的双频带水印识别系统
        position: 项目负责人
        location: 北京大学
        start_date: 2025-09
        end_date: 2026-01
        summary: >-
          针对 AI 生成图像的版权溯源需求，研究基于扩散模型频域水印的多供应商识别与鲁棒性增强。
          北京大学交流期间《生成模型基础》课程研究项目。
        highlights:
          - "双频带策略多密钥识别平均准确率达 98.3%"
          - "较单频带提升 0.6%–1.7%"
          - "课程评分 A"

